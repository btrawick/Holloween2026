<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0710" />
  <title>Westelijke Eilanden The Haunted Islands</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="fog fog-one" aria-hidden="true"></div>
  <div class="fog fog-two" aria-hidden="true"></div>
  <div class="fog fog-three" aria-hidden="true"></div>
  <div class="bats bats-a" aria-hidden="true">🦇 🦇 🦇</div>
  <div class="bats bats-b" aria-hidden="true">🦇 🦇</div>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Amsterdam · Westelijke Eilanden</p>
        <h1><span class="ghost">👻</span> Halloween Route 2026 <span class="pumpkin">🎃</span></h1>
        <p class="subhead">Follow the cursed trail from glowing door to glowing door. Candy awaits the brave.</p>
      </div>
      <div class="route-meta">
        <strong id="stopCount">2 haunted stops</strong>
        <span id="routeDistance">Summoning walking route…</span>
      </div>
    </header>

    <section class="map-card">
      <div class="moon" aria-hidden="true"></div>
      <div id="map" aria-label="Halloween route map"></div>
      <div class="map-overlay map-actions">
        <span>🕯️ Tap a pumpkin to reveal the house</span>
        <button id="locateMe" class="location-button" type="button">📍 Show my location</button>
      </div>
    </section>

    <section class="stops-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Tonight's haunted trail</p>
          <h2>Trick-or-treat stops</h2>
        </div>
      </div>
      <div id="stops" class="stops-list"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="./app.js"></script>
</body>
</html>
