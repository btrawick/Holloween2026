<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Westelijke Eilanden Halloween Route 2026</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Amsterdam · Westelijke Eilanden</p>
        <h1>Halloween Route 2026 🎃</h1>
        <p class="subhead">A simple family walking route across the neighborhood.</p>
      </div>
      <div class="route-meta">
        <strong id="stopCount">2 stops</strong>
        <span id="routeDistance">Route preview</span>
      </div>
    </header>

    <section class="map-card">
      <div id="map" aria-label="Halloween route map"></div>
      <div class="map-overlay">
        <span>Tap a pumpkin to see the house</span>
      </div>
    </section>

    <section class="stops-panel">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Tonight's test route</p>
          <h2>Halloween houses</h2>
        </div>
      </div>
      <div id="stops" class="stops-list"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./app.js"></script>
</body>
</html>
